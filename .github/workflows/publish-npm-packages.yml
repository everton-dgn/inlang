name: publish npm packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish versioned packages (false verifies authentication and packaging only)
        type: boolean
        default: false
  workflow_run:
    workflows: ["Continuous Integration"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: npm-publishing
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'generaltranslation/inlang' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    environment: publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install pinned npm with trusted publishing support
        run: npm install --global npm@11.21.2

      - name: Verify every package's trusted publisher without releasing
        run: node scripts/verify-npm-publishing.mjs

      - name: Build published packages and their workspace dependencies
        run: node scripts/verify-npm-publishing.mjs --build

      - name: Verify package archives without releasing
        run: node scripts/verify-npm-publishing.mjs --pack

      - name: Publish versioned packages with OIDC
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: pnpm exec changeset publish
